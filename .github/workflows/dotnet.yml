name: Build API
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore OdontoCare.slnx
      - name: Build
        run: dotnet build OdontoCare.slnx --no-restore --configuration Release
